# ─────────────────────────────────────────────────────────────────────────────
# Compose fragment: head-node nginx stream relay.
#
# Deploy on the HEAD node (the host that can reach the ObsVM) when compute nodes
# are network-blind to the ObsVM. Renders nothing itself — point it at a config
# produced by ../head-node/setup-relay.sh, or mount the template after envsubst.
#
# Usage (standalone):
#   METRICS_TARGET=<obsvm-host> RELAY_RW_PORT=19090 RELAY_LOKI_PORT=13100 \
#     ../head-node/setup-relay.sh --system   # writes /etc/nvis-relay/nginx.conf
#   docker compose -f head-relay.compose.yml up -d
#
# Or merge into the platform stack:
#   docker compose -f ../../platform/docker-compose.yml -f head-relay.compose.yml up -d
#
# All values come from .env / the interview installer — no IPs are baked in.
# ─────────────────────────────────────────────────────────────────────────────
services:
  head-relay:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: nvis-head-relay
    restart: unless-stopped
    # Rendered config from setup-relay.sh (envsubst of nginx-stream-relay.conf.template).
    volumes:
      - /etc/nvis-relay/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${RELAY_RW_PORT:-19090}:${RELAY_RW_PORT:-19090}"
      - "${RELAY_LOKI_PORT:-13100}:${RELAY_LOKI_PORT:-13100}"
    healthcheck:
      # relay is L4-only; a TCP connect to the remote_write listener proves it is up
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${RELAY_RW_PORT:-19090} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
