# =============================================================================
# Loki — single-binary log store for the NVIS appliance.
# Filesystem storage, no external object store; sized for a single ObsVM host.
# Logs arrive from GPU-node Alloy agents (syslog / journald / job logs) either
# directly or via the central Alloy push gateway (:9098).
# =============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Cluster-scale ingest guards — large fabrics fan a lot of syslog at Loki.
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  max_streams_per_user: 0
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 744h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  align_queries_with_step: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
